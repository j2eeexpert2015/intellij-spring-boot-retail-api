# Docker profile: PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/retaildb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:retail}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:retail}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info,mappings,beans
management.endpoint.health.show-details=always

retail.low-stock-threshold=5
retail.default-currency=USD
retail.support-email=support@retail-demo.com
