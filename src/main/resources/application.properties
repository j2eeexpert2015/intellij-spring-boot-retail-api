spring.application.name=eclipse-spring-boot-retail-api

# Default local profile: H2 in-memory database
spring.datasource.url=jdbc:h2:mem:retaildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Required for Spring Tools live/runtime demos and Actuator proof URLs
management.endpoints.web.exposure.include=health,info,mappings,beans
management.endpoint.health.show-details=always

retail.low-stock-threshold=5
retail.default-currency=USD
retail.support-email=support@retail-demo.com
